overwrite: true
schema:
  - './graphql/schema/**/*.graphql'
generates:
  src/gen/schema-types.ts:
    plugins:
      - typescript
  src/gen/graphqlTypes.ts:
    documents:
      - './graphql/documents/**/*.graphql'
    plugins:
      - add:
          content: '// Source code generated by graphql-codegen. DO NOT EDIT!'
      - add:
          content: "export * from './schema-types';"
      - typescript-operations
      - typed-document-node:
          onlyOperationTypes: true
    config:
      enumType: native
hooks:
  afterAllFileWrite:
    - prettier --write
